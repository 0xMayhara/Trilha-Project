[project]
name = "trilha-backend"
version = "0.1.0"
description = "Security Remediation Management platform - backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "celery[redis]>=5.6.3",
    "django>=5.2,<6.2",
    "djangorestframework>=3.18.3",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100
# Generated by Django; reviewed via the database-migration skill instead of lint.
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]
"config/settings/*.py" = ["E402", "F403", "F405"]
